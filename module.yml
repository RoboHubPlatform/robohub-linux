#
# robohub-linux — RoboHub platform for Linux hosts.
#
# Implements the robohub-common HAL and network contracts over POSIX, so a
# gateway-only mode — a relay — runs, and is tested, on the machine it aggregates
# from.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-linux
  id: robohub.platform.linux
  previous_ids:
    - robohub-linux
  type: platform
  version: 0.2.0
  description: >
    RoboHub platform for a Linux host: the console, the clock, a serial port and
    sockets, over POSIX. A host has no OneWire, I2C, SPI or GPIO, so those
    contracts are simply not registered and a smoke reports them as absent.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

platform: robohub

hardware:
  supported:
    - native
    - uno-q
  boards: boards/
  presets: presets/

build:
  language: c
  standard: c11
  include_dirs:
    - include/
  sources:
    - src/linux_platform.c
    - src/linux_net.c
    - src/linux_nonce.c

depends:
  - name: robohub-common
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

# What this platform needs on the machine it runs on, which is different from
# what it depends on. Deploying a program to a board's Linux side is an SSH copy
# and a start; flashing its MCU is Arduino's flasher; a gateway image is built
# with Docker. rho doctor reads these and reports; nothing the toolchain fetches
# produces them.
system_deps:
  executables:
    # The UNO Q's Linux side is arm64; a build for it on another machine is a
    # cross build.
    - name: aarch64-linux-gnu-gcc
      version_flag: "--version"
      install:
        apt: gcc-aarch64-linux-gnu
        brew: aarch64-unknown-linux-gnu
    - name: ssh
      install:
        apt: openssh-client
        brew: openssh
    - name: rsync
      install:
        apt: rsync
        brew: rsync
    - name: arduino-flasher-cli
      version_flag: "--version"
      install:
        apt: arduino-flasher-cli
    - name: docker
      install:
        apt: docker.io
        brew: docker

tests:
  enabled: true
  test_dirs:
    - tests/
  test_files:
    - tests/test_linux_platform.c

testing:
  host_tests:
    enabled: true
    target_constraint: "native"

package:
  kind: library
  binary: false

metadata:
  tags:
    - platform
    - linux
    - posix
    - host
    - gateway
  stability: experimental
  visibility: public

docs:
  title: RoboHub Linux Platform
  section: platforms
  order: "40"
  index: docs/index.md
  sources:
    - docs/index.md
