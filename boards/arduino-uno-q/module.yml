#
# arduino-uno-q — Arduino UNO Q board support.
#
# The board is one thing with two halves: a Qualcomm QRB2210 running Debian —
# which is the Linux platform this module implements — and an STM32U585
# companion MCU. A program for the Linux side is built as an aarch64 program and
# deployed over SSH; firmware for the MCU is built with Arduino's toolchain and
# flashed with arduino-flasher-cli. The board's target spec carries both a
# deploy block and a flash block, and each tool reads the one it is for.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: arduino-uno-q
  type: platform-board
  version: 0.1.0
  description: >
    Board support for the Arduino UNO Q (QRB2210 + STM32U585): the Linux side a
    program is deployed to, and the companion MCU it is flashed with.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

hardware:
  presets: presets/
  target: target.json

build:
  language: c
  standard: c11
  # The board brings no sources of its own: the platform's POSIX sources are the
  # program, and this board only says how it is built and reached.
  sources: []

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

board:
  designation: ARDUINO_UNO_Q
  summary: "The UNO Q Linux side: a Debian aarch64 host with WiFi, reached over SSH or ADB."
  mcu: STM32U585
  family: QRB2210
  core: Cortex-A53
  preset: uno-q
  target: uno-q
  resources:
    ram: 2 GiB
    flash: 16 GiB eMMC
  host:
    os: debian
    arch: aarch64
  companion_mcu:
    part: STM32U585
    core: Cortex-M33
  connectors:
    - name: USB_C
    - name: HEADERS
    - name: DEBUG_SWD
  programmer:
    tool: arduino-flasher-cli
    interface: usb
  flash:
    tool: arduino-flasher-cli
    command: "arduino-flasher-cli upload --board uno-q {binary}"
  deploy:
    method: rsync
    host: uno-q.local
    port: 22
    user: arduino
    path: /home/arduino/apps
    run: "cd {artifact} && ./{artifact}"
  pins:
    uart_mcu_tx: {}
    uart_mcu_rx: {}
  peripherals:
    - name: uart_mcu
      kind: uart
# What this board can be in a deployment. The keeper reads these at runtime, so
# a gateway planner lists the boards that can do the job instead of a list
# written into the planner. A host board gateways; it does not sense.
capabilities:
  gateway: true
  relay: true
  node: false
  edge: false
  host: true
  wireless: true
  ethernet: false
  links: "uart console usb wifi socket"
  buses: "uart usb"
  deploy: "ssh adb docker"

# How a deployment reaches this board. `adb` is the UNO Q's USB shell, `arm64`
# is the architecture the gateway is cross-built for, and `apps_dir` is where
# a pushed gateway is started. A board that speaks SSH says `ssh` here and the
# keeper uses the host and user saved in the network step.
deployment:
  kconfig: "CONFIG_RH_BOARD_ARDUINO_UNO_Q=y"
  method: "adb"
  arch: "arm64"
  apps_dir: "/home/arduino/apps"

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - arduino
    - uno-q
    - linux
    - debian
    - stm32u585
    - aarch64
  stability: experimental
  visibility: public
